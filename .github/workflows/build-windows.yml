name: Build Windows

concurrency:
  group: windows-dev-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Build executable
        run: pyinstaller --clean --noconfirm --onefile --windowed --paths src --name GIS-JKH-Assistant src/gis_jkh_assistant/__main__.py

      - name: Pack Windows build
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Path dist/package -Force | Out-Null
          Copy-Item dist/GIS-JKH-Assistant.exe dist/package/GIS-JKH-Assistant.exe -Force
          Copy-Item browser-extension dist/package/browser-extension -Recurse -Force
          "Build version: $version" | Out-File -FilePath dist/package/VERSION.txt -Encoding utf8
          Compress-Archive -Path dist/package/* -DestinationPath dist/GIS-JKH-Assistant-windows.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIS-JKH-Assistant-0.1.0.dev35-windows
          path: dist/GIS-JKH-Assistant-windows.zip

      - name: Publish rolling GitHub prerelease
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $repo = "${{ github.repository }}"
          $sha = "${{ github.sha }}"
          $asset = "dist/GIS-JKH-Assistant-windows.zip"
          $notes = @"
          Автоматическая тестовая сборка GIS ЖКХ Assistant.

          Версия: $version
          Коммит: $sha

          Архив содержит GIS-JKH-Assistant.exe и папку browser-extension.
          Для автоматического обмена с ГИС ЖКХ установите расширение из этой папки
          в Chrome или Edge в режиме разработчика.

          Эта сборка предназначена для проверки текущей разработки.
          "@

          gh release view dev-latest --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit dev-latest --repo $repo --title "GIS ЖКХ Assistant — актуальная тестовая сборка" --notes $notes --prerelease
            gh release upload dev-latest $asset --repo $repo --clobber
          }
          else {
            gh release create dev-latest $asset --repo $repo --target $sha --title "GIS ЖКХ Assistant — актуальная тестовая сборка" --notes $notes --prerelease
          }
