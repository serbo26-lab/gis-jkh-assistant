name: Build Windows

concurrency:
  group: windows-dev-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Build executable
        run: pyinstaller --clean --noconfirm --onefile --windowed --paths src --name GIS-JKH-Assistant src/gis_jkh_assistant/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIS-JKH-Assistant-0.1.0.dev6-windows
          path: dist/GIS-JKH-Assistant.exe
