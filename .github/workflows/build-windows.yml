name: Build Windows

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Check browser helper syntax
        run: node --check browser-extension/background.js

      - name: Test browser helper
        run: node --test

      - name: Check embedded browser helper
        run: python -B tools/package_browser_helper.py --check

      - name: Ruff
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build executable
        shell: pwsh
        run: |
          $python = (Get-Command python -CommandType Application | Select-Object -First 1).Source
          $pythonDirectory = Split-Path -Parent $python
          # Do not collect incompatible Qt/ICU DLLs from unrelated tools in PATH.
          $env:PATH = "$pythonDirectory;$pythonDirectory\Scripts;$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          & $python -m PyInstaller --clean --noconfirm --onefile --windowed --paths src --collect-data gis_jkh_assistant.browser --name "GIS JKH Assistant" src/gis_jkh_assistant/__main__.py
          if ($LASTEXITCODE -ne 0) { throw "Cannot build Windows executable" }

      - name: Pack Windows build
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python -B tools/package_windows.py
          if ($LASTEXITCODE -ne 0) { throw "Cannot package Windows build" }

      - name: Upload workflow artifact
        # The rolling release is mandatory; a second Actions copy is optional.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GIS JKH Assistant ${{ env.BUILD_VERSION }} windows
          path: "dist/GIS.JKH.Assistant-windows.zip"
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Publish rolling GitHub prerelease
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $repo = "${{ github.repository }}"
          $sha = "${{ github.sha }}"
          $asset = "dist/GIS.JKH.Assistant-windows.zip"
          $title = "ГИС ЖКХ Ассистент — $version"
          $helperVersion = (Get-Content browser-extension/manifest.json -Raw | ConvertFrom-Json).version
          $executableHash = (Get-FileHash "dist/GIS JKH Assistant.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $section = [regex]::Match($changelog, "(?ms)^## " + [regex]::Escape($version) + " —.*?(?=^## |\z)").Value.Trim()
          if (-not $section) { throw "Missing CHANGELOG section for $version" }
          $notes = @"
          Программа: $version
          Помощник: $helperVersion
          "@
          "Commit: $sha`nEXE SHA256: $executableHash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $notesFile = Join-Path $env:RUNNER_TEMP "dev-release-notes.md"
          [System.IO.File]::WriteAllText($notesFile, $notes, [System.Text.UTF8Encoding]::new($false))

          gh release view dev-latest --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api "repos/$repo/git/refs/tags/dev-latest" --method PATCH -f sha=$sha -F force=true
            if ($LASTEXITCODE -ne 0) { throw "Cannot update dev-latest tag" }
            gh release upload dev-latest $asset --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Cannot upload dev-latest asset" }
            gh release edit dev-latest --repo $repo --title $title --notes-file $notesFile --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Cannot update dev-latest release notes" }
          }
          else {
            gh release create dev-latest $asset --repo $repo --target $sha --title $title --notes-file $notesFile --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Cannot create dev-latest release" }
          }
