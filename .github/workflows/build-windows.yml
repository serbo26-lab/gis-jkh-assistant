name: Build Windows

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Check browser helper syntax
        run: node --check browser-extension/background.js

      - name: Test browser helper
        run: node --test

      - name: Check embedded browser helper
        run: python -B tools/package_browser_helper.py --check

      - name: Ruff
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build executable
        run: pyinstaller --clean --noconfirm --onefile --windowed --paths src --collect-data gis_jkh_assistant.browser --name "GIS JKH Assistant" src/gis_jkh_assistant/__main__.py

      - name: Pack Windows build
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path dist/package -Force | Out-Null
          Copy-Item "dist/GIS JKH Assistant.exe" "dist/package/GIS JKH Assistant.exe" -Force
          Copy-Item browser-extension dist/package/browser-extension -Recurse -Force
          Copy-Item README.md, CHANGELOG.md dist/package -Force
          "Build version: $version" | Out-File -FilePath dist/package/VERSION.txt -Encoding utf8
          @{
            version = $version
            helper_version = (Get-Content browser-extension/manifest.json -Raw | ConvertFrom-Json).version
            source_commit = "${{ github.sha }}"
            executable_sha256 = (Get-FileHash "dist/GIS JKH Assistant.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Out-File -FilePath dist/package/BUILD_INFO.json -Encoding utf8
          Compress-Archive -Path dist/package/* -DestinationPath "dist/GIS.JKH.Assistant-windows.zip" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIS JKH Assistant ${{ env.BUILD_VERSION }} windows
          path: "dist/GIS.JKH.Assistant-windows.zip"

      - name: Publish rolling GitHub prerelease
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $repo = "${{ github.repository }}"
          $sha = "${{ github.sha }}"
          $asset = "dist/GIS.JKH.Assistant-windows.zip"
          $title = "ГИС ЖКХ Ассистент — $version"
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $section = [regex]::Match($changelog, "(?ms)^## " + [regex]::Escape($version) + " —.*?(?=^## |\z)").Value.Trim()
          if (-not $section) { throw "Missing CHANGELOG section for $version" }
          $notes = @"
          Актуальная тестовая Windows-сборка ГИС ЖКХ Ассистент.

          Версия: $version
          Коммит: $sha

          Архив содержит GIS JKH Assistant.exe, README, CHANGELOG, сведения о сборке и папку browser-extension.
          Установка помощника: Настройки → Связь с ГИС ЖКХ → Установить браузерный помощник…
          Мастер готовит встроенные файлы и помогает добавить расширение в Chrome, Edge или Яндекс Браузер.
          Загрузку распакованного расширения нужно подтвердить в самом браузере.
          Для обмена требуется помощник 0.1.30 или новее. При обновлении через мастер отключите старую копию и загрузите новую папку.

          Эта сборка предназначена для проверки текущей разработки.

          $section
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP "dev-release-notes.md"
          [System.IO.File]::WriteAllText($notesFile, $notes, [System.Text.UTF8Encoding]::new($false))

          gh release view dev-latest --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api "repos/$repo/git/refs/tags/dev-latest" --method PATCH -f sha=$sha -F force=true
            if ($LASTEXITCODE -ne 0) { throw "Cannot update dev-latest tag" }
            gh release upload dev-latest $asset --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Cannot upload dev-latest asset" }
            gh release edit dev-latest --repo $repo --title $title --notes-file $notesFile --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Cannot update dev-latest release notes" }
          }
          else {
            gh release create dev-latest $asset --repo $repo --target $sha --title $title --notes-file $notesFile --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Cannot create dev-latest release" }
          }
