name: Diagnose Linux Qt crash

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-linux-qt.yml"
      - "tools/qt_diagnostic_plugin.py"
      - "src/gis_jkh_assistant/app/styles.py"
      - "src/gis_jkh_assistant/app/frozen_name.py"
      - "src/gis_jkh_assistant/app/page_layouts.py"
      - "tests/test_ui_scale.py"

permissions:
  contents: read

jobs:
  isolate:
    name: Qt crash / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        scenario: [isolated-ui, isolated-no-frozen, full-suite, full-gdb]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Install Qt runtime and native debugger
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0 fontconfig fonts-dejavu-core
          if [[ "${{ matrix.scenario }}" == "full-gdb" ]]; then
            sudo apt-get install -y gdb
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Print Qt runtime details
        run: |
          python -c 'import PySide6; from PySide6.QtCore import qVersion; print("PySide6:", PySide6.__version__, "Qt:", qVersion())'
          echo "QT_QPA_PLATFORM=$QT_QPA_PLATFORM"

      - name: Run isolated diagnostic scenario
        shell: bash
        run: |
          set -o pipefail
          case "${{ matrix.scenario }}" in
            isolated-ui)
              echo "DIAGNOSTIC: only the 18 layout/theme/scale parameter combinations"
              python -m pytest -vv -x tests/test_ui_scale.py::test_pages_fit_desktop_at_selected_ui_size
              ;;
            isolated-no-frozen)
              echo "DIAGNOSTIC: same test; FrozenName overlay replaced by no-op in test process"
              python -m pytest -p tools.qt_diagnostic_plugin -vv -x tests/test_ui_scale.py::test_pages_fit_desktop_at_selected_ui_size
              ;;
            full-suite)
              echo "DIAGNOSTIC: full suite, verbose IDs to identify preceding test"
              python -m pytest -vv -x
              ;;
            full-gdb)
              echo "DIAGNOSTIC: full test suite under gdb; native stack on SIGSEGV"
              gdb -q -batch \
                -ex "set pagination off" \
                -ex "set print thread-events off" \
                -ex "run" \
                -ex "thread apply all bt 28" \
                --args python -X faulthandler -m pytest -vv -x
              ;;
            *)
              echo "Unknown diagnostic scenario" >&2
              exit 2
              ;;
          esac
