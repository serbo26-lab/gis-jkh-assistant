<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Логотип ГИС ЖКХ Ассистент</title>
  <style>
    body{font-family:Inter,Arial,sans-serif;background:#0b1020;color:#e5edf8;margin:0;padding:32px}
    h1{font-size:24px;margin:0 0 8px}
    p{color:#9fb0c9;margin:0 0 24px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
    .card{background:#121a2b;border:1px solid #25314a;border-radius:20px;padding:20px}
    .card.light{background:#f3f7fc;border-color:#d3ddeb;color:#18253a}
    .title{font-weight:700;margin-bottom:16px}
    .frame{display:flex;justify-content:center;align-items:center;padding:16px;border-radius:16px}
    .dark .frame{background:#08101d}
    .light .frame{background:#ffffff}
    img{width:256px;height:256px;display:block}
    .links{margin-top:14px;font-size:14px}
    a{color:#7bc0ff;text-decoration:none}
    .light a{color:#0066cc}
  </style>
</head>
<body>
  <h1>Логотип программы</h1>
  <p>Две версии: для тёмной и светлой темы.</p>
  <div class="grid">
    <div class="card dark">
      <div class="title">Тёмная тема</div>
      <div class="frame"><img src="logo-dark.svg" alt="logo dark"></div>
      <div class="links"><a href="logo-dark.svg">Открыть SVG</a></div>
    </div>
    <div class="card light">
      <div class="title">Светлая тема</div>
      <div class="frame"><img src="logo-light.svg" alt="logo light"></div>
      <div class="links"><a href="logo-light.svg">Открыть SVG</a></div>
    </div>
  </div>
</body>
</html>
