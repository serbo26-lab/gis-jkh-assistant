[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gis-jkh-assistant"
dynamic = ["version"]
description = "GIS JKH Assistant desktop application for management organizations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1,<4",
    "PySide6>=6.8,<7",
    "reportlab>=4.2,<5",
    "Pillow>=10.4,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.7,<1",
    "pyinstaller>=6,<7",
]

[project.scripts]
gis-jkh-assistant = "gis_jkh_assistant.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gis_jkh_assistant.browser" = ["assets/browser-helper.zip"]
"gis_jkh_assistant.app" = ["assets/icons/light/*.svg", "assets/icons/dark/*.svg", "assets/branding/*.svg", "assets/branding/*.ico"]

[tool.setuptools.dynamic]
version = {attr = "gis_jkh_assistant.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
