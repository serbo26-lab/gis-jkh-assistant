[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gis-jkh-assistant"
dynamic = ["version"]
description = "Local assistant for management organization workflows in GIS ЖКХ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.7,<1",
    "pyinstaller>=6,<7",
]

[project.scripts]
gis-jkh-assistant = "gis_jkh_assistant.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "gis_jkh_assistant.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
